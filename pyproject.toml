[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diabetic-retinopathy-detection"
version = "0.1.0"
description = "Deep learning pipeline for automated diabetic retinopathy grading from retinal fundus images."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Giulio Matteucci"}]
dependencies = [
    "torch",
    "torchvision",
    "fastapi",
    "uvicorn",
    "opencv-python-headless",
    "albumentations",
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "joblib",
    "pyyaml",
    "Pillow",
    "requests",
    "python-multipart",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]

[project.urls]
Repository = "https://github.com/vanshgupta101106-droid/Diabetic_Retinopathy_Detection"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402"]
"tests/*" = ["E402"]
"src/app/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -p no:torchtyping"
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore:.*Failed to check for updates.*:UserWarning",
    "ignore:.*Error fetching version info.*:UserWarning",
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
