[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diabetic-retinopathy-detection"
version = "0.1.0"
description = "Deep learning pipeline for automated diabetic retinopathy grading from retinal fundus images."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Giulio Matteucci"}]
dependencies = [
    "torch",
    "torchvision",
    "fastapi",
    "uvicorn",
    "opencv-python-headless",
    "albumentations",
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "joblib",
    "pyyaml",
    "Pillow",
    "requests",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]

[project.urls]
Repository = "https://github.com/gmatteuc/Diabetic_retinopathy_detection"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -p no:torchtyping"
