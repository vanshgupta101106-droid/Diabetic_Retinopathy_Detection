project_name: "Diabetic_Retinopathy_Detection"
version: "0.1.0"

data:
  raw_path: "data"
  processed_path: "data/processed"
  image_size: [512, 512]
  batch_size: 32
  num_workers: 4
  # Preprocessing
  crop_black_borders: true
  normalization: "imagenet" # or 'standard'

model:
  name: "resnet50"
  num_classes: 5
  dropout_rate: 0.5
  pretrained: true

train:
  seed: 42
  learning_rate: 1.0e-4
  epochs: 20
  early_stopping_patience: 5
  val_split: 0.15
  test_split: 0.15

logging:
  save_dir: "reports"
  tensorboard: true
